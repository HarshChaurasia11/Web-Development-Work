<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techkart - Login Page</title>
    <link rel="shortcut icon" href="Assets/favicon.ico" type="image/x-icon">
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: linear-gradient(90deg, #667db6, #0082c8, #0082c8, #667db6);
        }

        main{
            border-radius: 50px;
            box-shadow: 0px 0px 20px 5px black;
        }

        .container {
            /* text-align: center; */
            width: 28vw;
            margin: auto;
            padding: 70px;
            border-radius: 50px;
            box-shadow: inset 0px 0px 200px 5px white;
        }

        .box {
            text-align: center;
        }

        .profile {
            height: 200px;
            border: 1px solid black;
            border-radius: 50%;
        }

        .welcome {
            font-size: 3em;
        }

        .input {
            font-size: 25px;
            border-bottom: 2px solid black;
            padding: 15px 0px;
        }

        #email {
            background: none;
            border: none;
            font-size: 25px;
        }

        #email:focus {
            border: none;
            outline: none;
        }

        #password {
            background: none;
            border: none;
            font-size: 25px;
        }

        #password:focus {
            border: none;
            outline: none;
        }

        .tick {
            margin: 15px 0px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            font-size: 25px;
        }

        .forget>a {
            color: black;
            text-decoration: none;
        }

        .forget>a:hover {
            color: red;
        }

        .button {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
        }

        button {
            text-decoration: none;
            color: black;
            background-color: skyblue;
            padding: 8px 5vw;
            border-radius: 20px;
            font-size: 20px;
        }

        .button a {
            text-decoration: none;
            color: black;
        }

        button:active {
            background-color: #667db6;
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <div class="box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxYQGrYjxIuNygdqLUkCGsAzXPjbPqPV72_jcO3vefAw&s=10"
                    alt="" class="profile">
                <div class="welcome">Techkart <br> Welcomes You!</div>
            </div>
            <div class="input">
                <label for="email">📧
                </label>
                <input type="email" placeholder="Email ID" id="email">
            </div>
            <div class="input">
                <label for="password">🔒</label>
                <input type="password" placeholder="Password" id="password">
            </div>
            <div class="tick">
                <div class="check">
                    <input type="checkbox" id="checkbox">
                    <label for="checkbox">Remember me</label>
                </div>
                <div class="forget">
                    <a href="">Forget Password ? </a>
                </div>
            </div>
            <div class="button">
                <button><a href="">Login</a></button>
                <button><a href="">Sign_Up</a></button>
            </div>
        </div>
    </main>
</body>

</html>
