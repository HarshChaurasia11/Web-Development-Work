<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challange 7 : TechKart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Assets/favicon.ico">
</head>

<body>
    <img src="Assets/logo.png" alt="" class="fixed-logo">
    <header>
        <nav>
            <section class="nav_menu">
                <div class="brandname">
                    <img src="Assets/brand_name.png" height="60px" alt="TechKart">
                </div>

                <div class="search_box">
                    <input type="text" placeholder="Search products..." id="searchbox">
                    <label for="searchbox">🔍</label>
                </div>

                <div class="nav_links">
                    <span>Login</span>
                    <span>❤️</span>
                    <span>🛒</span>
                </div>

            </section>

            <<section class="nav_category">
                <div class="category_items">

                    <!-- First set -->
                    <span>📱 Smartphones</span>
                    <span>💻 Laptops</span>
                    <span>🎧 Headphones</span>
                    <span>⌚ Smart Watches</span>
                    <span>🎮 Gaming</span>
                    <span>📷 Cameras</span>

                    <!-- Duplicate set -->
                    <span>📱 Smartphones</span>
                    <span>💻 Laptops</span>
                    <span>🎧 Headphones</span>
                    <span>⌚ Smart Watches</span>
                    <span>🎮 Gaming</span>
                    <span>📷 Cameras</span>

                </div>
                </section>

        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="heroimg">
                <img src="Assets/hero_img_1.webp" alt="">
                <img src="Assets/hero_img_2.webp" alt="">
                <img src="Assets/hero_img_3.webp" alt="">
                <img src="Assets/hero_img_4.webp" alt="">
                <img src="Assets/hero_img_5.webp" alt="">
                <img src="Assets/hero_img_6.webp" alt="">
                <img src="Assets/hero_img_7.webp" alt="">
            </div>
        </section>

        <section class="headphones">
            <div class="trending-headphones">Trending HeadPhones Shop It Now!</div>
            <div class="headphone_cards">

                <div class="card card_1">
                    <img src="Assets/Card_image_1.png" alt="">
                    <div class="headphone-brand-name">Apple</div>
                    <div class="headphone_price"><b>Rs. </b>11999/-</div>
                    <button>Shop Now</button>
                </div>
                <div class="card card_2">
                    <img src="Assets/Card_image_2.png" alt="">
                    <div class="headphone-brand-name">boAT</div>
                    <div class="headphone_price"><b>Rs. </b>1999/-</div>
                    <button>Shop Now</button>
                </div>
                <div class="card card_3">
                    <img src="Assets/Card_image_3.png" alt="">
                    <div class="headphone-brand-name">Hammer</div>
                    <div class="headphone_price"><b>Rs. </b>4999/-</div>
                    <button>Shop Now</button>
                </div>
                <div class="card card_4">
                    <img src="Assets/Card_image_4.png" alt="">
                    <div class="headphone-brand-name">Bose</div>
                    <div class="headphone_price"><b>Rs. </b>4599/-</div>
                    <button>Shop Now</button>
                </div>
                <div class="card card_5">
                    <img src="Assets/Card_image_5.png" alt="">
                    <div class="headphone-brand-name">Noise</div>
                    <div class="headphone_price"><b>Rs. </b>1599/-</div>
                    <button>Shop Now</button>
                </div>
            </div>

        </section>
    </main>
</body>

</html>
